
name: Publish Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Show built artifacts & version
        run: |
          ls -la dist/
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              p = tomllib.load(f)['project']
          print(f\"Package : {p['name']}\")
          print(f\"Version : {p['version']}\")
          "

      - name: Fail if version already exists on PyPI
        run: |
          python - <<'PY'
          import tomllib, json, urllib.request, sys
          with open('pyproject.toml', 'rb') as f:
              p = tomllib.load(f)['project']
          name, version = p['name'], p['version']
          print(f'Checking PyPI for {name}=={version} ...')
          try:
              data = json.load(urllib.request.urlopen(f'https://pypi.org/pypi/{name}/json'))
              if version in data.get('releases', {}):
                  print(f'ERROR: Version {version} of {name} already exists on PyPI.')
                  print('Bump the version in pyproject.toml before publishing.')
                  sys.exit(1)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f'Package {name} not yet on PyPI — first publish!')
              else:
                  raise
          print(f'OK — {name}=={version} is safe to publish.')
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
